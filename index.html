<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabungan Warga - Digital Banking</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; }

        .app-container {
            width: 100%; max-width: 440px; height: 95vh; max-height: 760px;
            background: var(--card); border: 1px solid var(--border); border-radius: 20px;
            display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; background: var(--bg); border-bottom: 1px solid var(--border);
        }
        .header h1 { font-size: 1.1rem; font-weight: 700; }
        .btn-sm { background: var(--border); color: var(--text); border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .btn-logout { background: #7f1d1d; }

        .body { flex: 1; padding: 20px; overflow-y: auto; }
        .section { display: none; flex-direction: column; gap: 14px; }
        .section.active { display: flex; }

        /* Form & Inputs */
        .tabs { display: flex; background: var(--bg); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--muted); font-weight: 600; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: #fff; }

        .field { display: flex; flex-direction: column; gap: 6px; position: relative; }
        .field label { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
        .field input {
            width: 100%; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border);
            color: var(--text); border-radius: 10px; font-size: 1rem; outline: none;
        }
        .field input:focus { border-color: var(--primary); }

        .input-row { display: flex; gap: 8px; }
        .btn-icon { background: var(--primary); border: none; color: #fff; padding: 0 16px; border-radius: 10px; font-size: 1.2rem; cursor: pointer; }

        .suggestions {
            position: absolute; top: 100%; left: 0; right: 0; background: var(--bg);
            border: 1px solid var(--border); border-radius: 8px; max-height: 150px; overflow-y: auto; z-index: 50; display: none;
        }
        .suggestion-item { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; font-size: 0.9rem; }
        .suggestion-item:hover { background: rgba(37, 99, 235, 0.2); }

        .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 4px; }
        .quick-btn { background: var(--border); border: none; color: #fff; padding: 8px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }

        .btn-primary {
            width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none;
            border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 6px;
        }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--warning); }

        /* Dashboard & Cards */
        .balance-card {
            background: linear-gradient(135deg, #1d4ed8, #2563eb); padding: 20px; border-radius: 16px;
            cursor: pointer; user-select: none; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }
        .balance-card small { font-size: 0.8rem; opacity: 0.85; display: block; }
        .balance-card h2 { font-size: 1.85rem; margin: 6px 0; letter-spacing: 0.5px; }

        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .menu-btn {
            background: var(--bg); border: 1px solid var(--border); color: var(--text);
            padding: 16px 12px; border-radius: 12px; font-size: 0.9rem; font-weight: 600;
            display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;
        }
        .menu-btn:hover { border-color: var(--primary); }
        .menu-btn span { font-size: 1.5rem; }

        /* Lists */
        .list-box { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; max-height: 280px; overflow-y: auto; }
        .list-item { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .list-item:last-child { border-bottom: none; }

        /* QR & Scanner */
        #qr-reader { width: 240px; height: 240px; margin: 0 auto; border-radius: 14px; overflow: hidden; border: 2px solid var(--primary); background: #000; }
        .qr-box { background: var(--bg); padding: 20px; border-radius: 14px; text-align: center; border: 1px solid var(--border); }
        #qrcode { background: #fff; padding: 12px; border-radius: 10px; display: inline-block; margin: 12px 0; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none;
            justify-content: center; align-items: center; padding: 16px; z-index: 100;
        }
        .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 360px; padding: 20px; text-align: center; }
        .modal-box h3 { margin-bottom: 8px; }
        .modal-box p { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; line-height: 1.4; }
        .modal-actions { display: flex; gap: 10px; margin-top: 14px; }

        .receipt { background: #fff; color: #0f172a; padding: 16px; border-radius: 10px; text-align: left; font-family: monospace; font-size: 0.85rem; }
        .receipt-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
        #statusBar { text-align: center; font-size: 0.8rem; color: var(--muted); padding: 6px; min-height: 24px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <button class="btn-sm" id="backBtn" style="display:none;" onclick="navigate('home')">⬅ Kembali</button>
            <h1 id="pageTitle">Tabungan Warga</h1>
        </div>
        <button class="btn-sm btn-logout" id="logoutBtn" style="display:none;" onclick="logout()">Keluar</button>
    </div>

    <div class="body">
        <!-- 1. AUTH (LOGIN / REGISTER) -->
        <div id="authSection" class="section active">
            <div class="tabs">
                <button class="tab-btn active" id="tabLogin" onclick="setAuthMode('login')">Masuk</button>
                <button class="tab-btn" id="tabRegister" onclick="setAuthMode('register')">Buka Rekening</button>
            </div>

            <div class="field" id="nameField" style="display:none;">
                <label>Nama Lengkap Sesuai Identitas</label>
                <input type="text" id="regName" placeholder="Masukkan nama lengkap">
            </div>

            <div class="field">
                <label>Nomor HP (Nomor Rekening)</label>
                <input type="tel" id="authHp" placeholder="Contoh: 08123456789">
            </div>

            <div class="field">
                <label id="pinLabel">PIN Keamanan (6 Digit)</label>
                <input type="password" inputmode="numeric" maxlength="6" id="authPin" placeholder="••••••">
            </div>

            <button class="btn-primary" id="authSubmitBtn" onclick="submitAuth()">Masuk</button>
        </div>

        <!-- 2. DASHBOARD -->
        <div id="homeSection" class="section">
            <div class="balance-card" onclick="toggleBalance()">
                <small id="accInfo">Rekening: -</small>
                <h2 id="balanceText">Rp ••••••••</h2>
                <small id="balanceHint">Ketuk untuk menampilkan saldo</small>
            </div>

            <div class="menu-grid">
                <button class="menu-btn" onclick="navigate('transfer')"><span>💸</span>Transfer</button>
                <button class="menu-btn" onclick="openScanner('transfer')"><span>📷</span>Scan QR</button>
                <button class="menu-btn" onclick="navigate('myqr')"><span>🆔</span>QR Rekening</button>
                <button class="menu-btn" onclick="navigate('mutasi')"><span>📜</span>Mutasi Rekening</button>
                <button class="menu-btn" id="btnWargaTarik" onclick="infoTarikTunai()"><span>💵</span>Tarik Tunai</button>

                <!-- Menu Khusus Teller / Admin -->
                <button class="menu-btn admin-only" style="display:none; border-color:var(--success);" onclick="navigate('setorAdmin')"><span>📥</span>Setor Tunai</button>
                <button class="menu-btn admin-only" style="display:none; border-color:var(--warning);" onclick="navigate('tarikAdmin')"><span>📤</span>Tarik Tunai</button>
                <button class="menu-btn admin-only" style="display:none;" onclick="navigate('rekapAdmin')"><span>📑</span>Laporan PDF</button>
                <button class="menu-btn admin-only" style="display:none;" onclick="navigate('kelolaAdmin')"><span>👥</span>Data Nasabah</button>
            </div>
        </div>

        <!-- 3. TRANSFER -->
        <div id="transferSection" class="section">
            <div class="field">
                <label>Rekening Tujuan (No HP / Nama)</label>
                <div class="input-row">
                    <input type="text" id="tfTarget" placeholder="Cari nama atau nomor HP..." oninput="searchMember(this.value, 'tfSuggest', 'tfTarget', (hp) => selectedTfHp = hp)">
                    <button class="btn-icon" onclick="openScanner('transfer')">📷</button>
                </div>
                <div class="suggestions" id="tfSuggest"></div>
            </div>
            <div class="field">
                <label>Nominal Transfer (Rp)</label>
                <input type="number" id="tfAmount" placeholder="Minimal Rp 1.000">
                <div class="quick-grid">
                    <button class="quick-btn" onclick="addNominal('tfAmount', 20000)">+20rb</button>
                    <button class="quick-btn" onclick="addNominal('tfAmount', 50000)">+50rb</button>
                    <button class="quick-btn" onclick="addNominal('tfAmount', 100000)">+100rb</button>
                    <button class="quick-btn" onclick="addNominal('tfAmount', 500000)">+500rb</button>
                </div>
            </div>
            <button class="btn-primary btn-success" onclick="promptTransferPin()">Lanjutkan Transfer</button>
        </div>

        <!-- 4. SETOR TUNAI (ADMIN) -->
        <div id="setorAdminSection" class="section">
            <div class="field">
                <label>Nasabah Tujuan (No HP / Nama)</label>
                <div class="input-row">
                    <input type="text" id="setorTarget" placeholder="Cari nasabah..." oninput="searchMember(this.value, 'setorSuggest', 'setorTarget', (hp) => selectedSetorHp = hp)">
                    <button class="btn-icon" onclick="openScanner('setor')">📷</button>
                </div>
                <div class="suggestions" id="setorSuggest"></div>
            </div>
            <div class="field">
                <label>Nominal Setoran (Rp)</label>
                <input type="number" id="setorAmount" placeholder="Masukkan nominal">
                <div class="quick-grid">
                    <button class="quick-btn" onclick="addNominal('setorAmount', 50000)">+50rb</button>
                    <button class="quick-btn" onclick="addNominal('setorAmount', 100000)">+100rb</button>
                    <button class="quick-btn" onclick="addNominal('setorAmount', 200000)">+200rb</button>
                    <button class="quick-btn" onclick="addNominal('setorAmount', 500000)">+500rb</button>
                </div>
            </div>
            <button class="btn-primary btn-success" onclick="executeSetor()">Proses Setor Tunai</button>
        </div>

        <!-- 5. TARIK TUNAI (ADMIN) -->
        <div id="tarikAdminSection" class="section">
            <div class="field">
                <label>Nasabah Penarik (No HP / Nama)</label>
                <input type="text" id="tarikTarget" placeholder="Cari nasabah..." oninput="searchMember(this.value, 'tarikSuggest', 'tarikTarget', (hp) => selectedTarikHp = hp)">
                <div class="suggestions" id="tarikSuggest"></div>
            </div>
            <div class="field">
                <label>Nominal Penarikan (Rp)</label>
                <input type="number" id="tarikAmount" placeholder="Masukkan nominal">
            </div>
            <button class="btn-primary btn-warning" onclick="requestTarik()">Kirim Otorisasi ke HP Nasabah</button>
        </div>

        <!-- 6. SCANNER QR TERPADU -->
        <div id="scannerSection" class="section">
            <p style="text-align:center; font-size:0.9rem; color:var(--muted);">Arahkan kamera ke QR Rekening Nasabah</p>
            <div id="qr-reader"></div>
        </div>

        <!-- 7. QR REKENING SAYA -->
        <div id="myqrSection" class="section">
            <div class="qr-box">
                <strong id="qrOwnerName">Nama Nasabah</strong>
                <div style="color:var(--muted); font-size:0.85rem;" id="qrOwnerHp">No. Rek: -</div>
                <div id="qrcode"></div>
                <p style="font-size:0.8rem; color:var(--muted);">Tunjukkan QR ini untuk menerima transfer atau setor tunai.</p>
            </div>
        </div>

        <!-- 8. MUTASI REKENING -->
        <div id="mutasiSection" class="section">
            <div class="list-box" id="mutasiList"></div>
        </div>

        <!-- 9. LAPORAN & PDF (ADMIN) -->
        <div id="rekapAdminSection" class="section">
            <div id="pdfArea" style="background:var(--bg); padding:12px; border-radius:12px;">
                <h4 style="text-align:center; margin-bottom:10px;">Laporan Saldo Tabungan Warga</h4>
                <div class="list-box" id="rekapList" style="border:none;"></div>
            </div>
            <button class="btn-primary" onclick="exportPDF()">Unduh Laporan PDF</button>
        </div>

        <!-- 10. KELOLA NASABAH (ADMIN) -->
        <div id="kelolaAdminSection" class="section">
            <div class="list-box" id="nasabahList"></div>
            <button class="btn-primary" onclick="showAddMemberModal()">+ Tambah Nasabah Baru</button>
        </div>
    </div>

    <div id="statusBar"></div>
</div>

<!-- MODAL UNIVERSAL -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <h3 id="modalTitle">Judul</h3>
        <p id="modalDesc">Deskripsi</p>
        <div id="modalCustom"></div>
        <div class="modal-actions" id="modalActions"></div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz0IOrR9enMuQcAr45yNvz84PmOsqWD55zMD3MpjncxfgD21w-OTTTbuJsW7__A57gQEw/exec";

    let state = {
        authMode: 'login',
        user: null,
        hideBalance: true,
        members: [],
        mutations: [],
        scanContext: 'transfer',
        scannerInstance: null
    };

    let selectedTfHp = "", selectedSetorHp = "", selectedTarikHp = "";

    const normalizeHp = (num) => String(num || "").trim().replace(/^'+/, "").replace(/^(\+62|62|0)/, "");
    const normalizePin = (pin) => String(pin || "").trim().replace(/^'+/, "").replace(/^0+/, "");

    // --- API SYNC ---
    async function syncData() {
        try {
            const res = await fetch(`${API_URL}?action=getData`);
            const data = await res.json();
            state.members = data.anggota || [];
            state.mutations = data.mutasi || [];

            if (state.user) {
                const updated = state.members.find(m => normalizeHp(m.hp) === normalizeHp(state.user.hp));
                if (updated) {
                    state.user.saldo = Number(updated.saldo) || 0;
                    state.user.pass = String(updated.pass || "");
                    renderBalance();
                    if (!state.user.isAdmin && updated.pinTarik) {
                        openTarikApprovalModal(updated.pinTarik);
                    }
                }
            }
        } catch (e) {
            console.error("Sync error:", e);
        }
    }

    async function sendPost(payload) {
        setStatus("Memproses transaksi...");
        try {
            const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
            setStatus("");
            return await res.json();
        } catch (e) {
            setStatus("Gagal terhubung ke server.");
            return { status: "error" };
        }
    }

    // --- AUTHENTICATION ---
    function setAuthMode(mode) {
        state.authMode = mode;
        document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
        document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
        document.getElementById('nameField').style.display = mode === 'register' ? 'flex' : 'none';
        document.getElementById('pinLabel').textContent = mode === 'register' ? 'Buat PIN Keamanan (6 Digit)' : 'Masukkan PIN (6 Digit)';
        document.getElementById('authSubmitBtn').textContent = mode === 'register' ? 'Daftar Rekening' : 'Masuk';
    }

    async function submitAuth() {
        const hp = document.getElementById('authHp').value.trim();
        const pin = document.getElementById('authPin').value.trim();

        if (!hp || pin.length < 4) return showModal("Validasi Gagal", "Masukkan Nomor HP dan PIN yang valid.");
        if (state.members.length === 0) await syncData();

        if (state.authMode === 'register') {
            const name = document.getElementById('regName').value.trim();
            if (!name) return showModal("Validasi Gagal", "Nama lengkap wajib diisi.");
            if (state.members.some(m => normalizeHp(m.hp) === normalizeHp(hp))) {
                return showModal("Gagal", "Nomor HP sudah terdaftar sebagai rekening.");
            }

            await sendPost({ type: "register", name, hp, saldo: 0, pass: pin, pattern: "" });
            await syncData();

            showModal(
                "Rekening Aktif",
                "Pendaftaran berhasil. Silakan masuk menggunakan Nomor HP dan PIN Anda.",
                "",
                `<button class="btn-primary" onclick="closeModal(); document.getElementById('authPin').value=''; setAuthMode('login');">OK</button>`
            );
        } else {
            const found = state.members.find(m => normalizeHp(m.hp) === normalizeHp(hp));
            if (!found) return showModal("Gagal Masuk", "Nomor rekening tidak ditemukan.");

            if (!found.pass || found.pass === "1234") {
                return openForcePinModal(found);
            }

            const sheetPin = String(found.pass || "").trim();
            if (sheetPin !== pin && normalizePin(sheetPin) !== normalizePin(pin)) {
                return showModal("Gagal Masuk", "PIN yang Anda masukkan salah.");
            }

            state.user = {
                name: found.name,
                hp: String(found.hp),
                saldo: Number(found.saldo) || 0,
                pass: String(found.pass),
                isAdmin: (found.role && found.role.toLowerCase() === 'admin')
            };

            document.getElementById('authPin').value = "";
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('accInfo').textContent = `${state.user.name} • Rek: ${state.user.hp}`;
            document.getElementById('btnWargaTarik').style.display = state.user.isAdmin ? 'none' : 'flex';
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = state.user.isAdmin ? 'flex' : 'none');

            renderBalance();
            navigate('home');
            syncData();
        }
    }

    function openForcePinModal(user) {
        showModal(
            "Aktivasi Keamanan Akun",
            `Halo ${user.name}, akun Anda dibuat oleh Admin. Silakan buat PIN 6 digit pribadi Anda sebelum melanjutkan:`,
            `<input type="password" inputmode="numeric" maxlength="6" id="newPinInput" placeholder="Masukkan 6 digit PIN baru" style="width:100%; padding:12px; background:var(--bg); border:1px solid var(--border); color:#fff; border-radius:8px; text-align:center; font-size:1.1rem;">`,
            `<button class="btn-primary" onclick="saveInitialPin('${user.hp}')">Simpan PIN</button>`
        );
    }

    async function saveInitialPin(hp) {
        const newPin = document.getElementById('newPinInput').value.trim();
        if (newPin.length < 4) return alert("PIN minimal 4-6 digit angka.");
        await sendPost({ type: "updateCredentials", hp, pass: newPin, pattern: "" });
        await syncData();
        closeModal();
        showModal("Berhasil", "PIN berhasil disimpan. Silakan login kembali.");
    }

    function logout() {
        stopScanner();
        state.user = null;
        document.getElementById('logoutBtn').style.display = 'none';
        navigate('auth');
    }

    // --- NAVIGATION & UI ---
    function navigate(page) {
        stopScanner();
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(`${page}Section`).classList.add('active');

        const titles = {
            auth: "Tabungan Warga", home: "Beranda", transfer: "Transfer Dana",
            setorAdmin: "Setor Tunai", tarikAdmin: "Tarik Tunai", scanner: "Pindai QR",
            myqr: "QR Rekening", mutasi: "Mutasi Rekening", rekapAdmin: "Laporan Saldo", kelolaAdmin: "Data Nasabah"
        };
        document.getElementById('pageTitle').textContent = titles[page] || "Tabungan Warga";
        document.getElementById('backBtn').style.display = (page === 'home' || page === 'auth') ? 'none' : 'block';

        if (page === 'myqr') renderMyQR();
        if (page === 'mutasi') renderMutations();
        if (page === 'rekapAdmin') renderRekap();
        if (page === 'kelolaAdmin') renderNasabah();
    }

    function toggleBalance() {
        state.hideBalance = !state.hideBalance;
        renderBalance();
    }

    function renderBalance() {
        document.getElementById('balanceText').textContent = state.hideBalance
            ? "Rp ••••••••"
            : `Rp ${state.user.saldo.toLocaleString('id-ID')}`;
        document.getElementById('balanceHint').textContent = state.hideBalance
            ? "Ketuk untuk menampilkan saldo"
            : "Ketuk untuk menyembunyikan saldo";
    }

    function addNominal(inputId, val) {
        const el = document.getElementById(inputId);
        el.value = (parseInt(el.value) || 0) + val;
    }

    // --- SEARCH AUTOCOMPLETE ---
    function searchMember(query, boxId, inputId, onSelect) {
        const box = document.getElementById(boxId);
        const q = query.trim().toLowerCase();
        if (!q) { box.style.display = 'none'; return; }

        const matches = state.members.filter(m => m.name.toLowerCase().includes(q) || String(m.hp).includes(q));
        box.innerHTML = matches.map(m => `
            <div class="suggestion-item" onclick="selectSuggestion('${boxId}', '${inputId}', '${m.name}', '${m.hp}', ${onSelect})">
                <strong>${m.name}</strong><span>${m.hp}</span>
            </div>
        `).join('');
        box.style.display = matches.length ? 'block' : 'none';
    }

    function selectSuggestion(boxId, inputId, name, hp, callback) {
        document.getElementById(inputId).value = `${name} (${hp})`;
        document.getElementById(boxId).style.display = 'none';
        callback(hp);
    }

    // --- TRANSACTIONS (STANDAR OTORISASI PIN) ---
    function promptTransferPin() {
        const targetHp = selectedTfHp || document.getElementById('tfTarget').value.trim();
        const amount = parseInt(document.getElementById('tfAmount').value);

        if (!targetHp || isNaN(amount) || amount < 1000) return showModal("Validasi", "Pilih rekening tujuan dan masukkan nominal minimal Rp 1.000.");
        if (normalizeHp(targetHp) === normalizeHp(state.user.hp)) return showModal("Validasi", "Tidak dapat mentransfer ke rekening sendiri.");
        if (amount > state.user.saldo && !state.user.isAdmin) return showModal("Saldo Tidak Cukup", "Saldo Anda tidak mencukupi untuk transaksi ini.");

        const receiver = state.members.find(m => normalizeHp(m.hp) === normalizeHp(targetHp));
        if (!receiver) return showModal("Rekening Tidak Ditemukan", "Pastikan nomor rekening tujuan sudah benar.");

        showModal(
            "Konfirmasi Transfer",
            `Transfer sebesar <strong>Rp ${amount.toLocaleString('id-ID')}</strong> ke <strong>${receiver.name}</strong> (${receiver.hp}). Masukkan PIN Anda:`,
            `<input type="password" inputmode="numeric" maxlength="6" id="confirmTfPin" placeholder="••••••" style="width:100%; padding:12px; background:var(--bg); border:1px solid var(--border); color:#fff; border-radius:8px; text-align:center; font-size:1.2rem;">`,
            `<button class="btn-sm" style="flex:1; padding:12px;" onclick="closeModal()">Batal</button>
             <button class="btn-primary btn-success" style="flex:1; margin:0;" onclick="executeTransfer('${receiver.hp}', ${amount})">Kirim</button>`
        );
    }

    async function executeTransfer(receiverHp, amount) {
        const pin = document.getElementById('confirmTfPin').value.trim();
        const userPin = String(state.user.pass || "").trim();
        if (pin !== userPin && normalizePin(pin) !== normalizePin(userPin)) return alert("PIN Keamanan Salah!");

        closeModal();
        const receiver = state.members.find(m => normalizeHp(m.hp) === normalizeHp(receiverHp));
        const time = new Date().toLocaleString('id-ID');

        state.user.saldo -= amount;
        renderBalance();

        await sendPost({
            type: "transfer",
            senderHp: state.user.hp,
            senderSaldo: state.user.saldo,
            receiverHp: receiver.hp,
            receiverSaldo: (Number(receiver.saldo) || 0) + amount,
            user: state.user.name,
            title: `Transfer ke ${receiver.name}`,
            time,
            amount: `-Rp ${amount.toLocaleString('id-ID')}`,
            color: "var(--danger)"
        });

        await syncData();
        document.getElementById('tfTarget').value = "";
        document.getElementById('tfAmount').value = "";
        selectedTfHp = "";

        showReceipt({
            jenis: "TRANSFER ANTAR REKENING",
            nama: receiver.name,
            hp: receiver.hp,
            nominal: amount,
            saldo: state.user.saldo,
            waktu: time,
            petugas: state.user.name
        });
        navigate('home');
    }

    async function executeSetor() {
        const targetHp = selectedSetorHp || document.getElementById('setorTarget').value.trim();
        const amount = parseInt(document.getElementById('setorAmount').value);

        if (!targetHp || isNaN(amount) || amount < 1000) return showModal("Validasi", "Lengkapi data nasabah dan nominal setoran.");
        const target = state.members.find(m => normalizeHp(m.hp) === normalizeHp(targetHp));
        if (!target) return showModal("Gagal", "Rekening nasabah tidak ditemukan.");

        const newSaldo = (Number(target.saldo) || 0) + amount;
        const time = new Date().toLocaleString('id-ID');

        await sendPost({
            type: "setorTunai",
            receiverHp: target.hp,
            receiverSaldo: newSaldo,
            user: target.name,
            title: "Setor Tunai Teller",
            time,
            amount: `+Rp ${amount.toLocaleString('id-ID')}`,
            color: "var(--success)"
        });

        await syncData();
        document.getElementById('setorTarget').value = "";
        document.getElementById('setorAmount').value = "";
        selectedSetorHp = "";

        showReceipt({
            jenis: "SETOR TUNAI",
            nama: target.name,
            hp: target.hp,
            nominal: amount,
            saldo: newSaldo,
            waktu: time,
            petugas: state.user.name
        });
    }

    async function requestTarik() {
        const targetHp = selectedTarikHp || document.getElementById('tarikTarget').value.trim();
        const amount = parseInt(document.getElementById('tarikAmount').value);

        if (!targetHp || isNaN(amount) || amount < 1000) return showModal("Validasi", "Lengkapi data nasabah dan nominal penarikan.");
        const target = state.members.find(m => normalizeHp(m.hp) === normalizeHp(targetHp));
        if (!target) return showModal("Gagal", "Nasabah tidak ditemukan.");
        if (amount > (Number(target.saldo) || 0)) return showModal("Saldo Kurang", "Saldo nasabah tidak mencukupi.");

        const token = Math.floor(100000 + Math.random() * 900000);
        await sendPost({ type: "requestTarik", hp: target.hp, pin: `${amount}|${token}` });

        document.getElementById('tarikTarget').value = "";
        document.getElementById('tarikAmount').value = "";
        selectedTarikHp = "";
        showModal("Menunggu Otorisasi", `Permintaan penarikan Rp ${amount.toLocaleString('id-ID')} telah dikirim ke aplikasi <strong>${target.name}</strong> untuk dikonfirmasi dengan PIN.`);
        navigate('home');
    }

    function openTarikApprovalModal(pinData) {
        if (document.getElementById('modalOverlay').style.display === 'flex') return;
        const amount = Number(pinData.split('|')[0]);

        showModal(
            "Otorisasi Tarik Tunai",
            `Teller mengajukan penarikan tunai sebesar <strong>Rp ${amount.toLocaleString('id-ID')}</strong> dari rekening Anda. Masukkan PIN untuk menyetujui:`,
            `<input type="password" inputmode="numeric" maxlength="6" id="approveTarikPin" placeholder="••••••" style="width:100%; padding:12px; background:var(--bg); border:1px solid var(--border); color:#fff; border-radius:8px; text-align:center; font-size:1.2rem;">`,
            `<button class="btn-sm" style="flex:1; padding:12px;" onclick="rejectTarik()">Tolak</button>
             <button class="btn-primary btn-success" style="flex:1; margin:0;" onclick="confirmTarik(${amount})">Setujui</button>`
        );
    }

    async function confirmTarik(amount) {
        const pin = document.getElementById('approveTarikPin').value.trim();
        const userPin = String(state.user.pass || "").trim();
        if (pin !== userPin && normalizePin(pin) !== normalizePin(userPin)) return alert("PIN salah!");
        if (state.user.saldo < amount) { closeModal(); return showModal("Gagal", "Saldo tidak mencukupi."); }

        state.user.saldo -= amount;
        renderBalance();
        closeModal();

        await sendPost({
            type: "tarikTunai",
            senderHp: state.user.hp,
            senderSaldo: state.user.saldo,
            user: state.user.name,
            title: "Tarik Tunai Teller",
            time: new Date().toLocaleString('id-ID'),
            amount: `-Rp ${amount.toLocaleString('id-ID')}`,
            color: "var(--danger)"
        });
        await sendPost({ type: "requestTarik", hp: state.user.hp, pin: "" });
        await syncData();
        showModal("Berhasil", "Penarikan tunai telah disetujui dan saldo Anda telah disesuaikan.");
    }

    async function rejectTarik() {
        await sendPost({ type: "requestTarik", hp: state.user.hp, pin: "" });
        closeModal();
        showModal("Dibatalkan", "Permintaan penarikan tunai ditolak.");
    }

    function infoTarikTunai() {
        showModal("Penarikan Tunai", "Silakan kunjungi Teller / Admin RT dengan membawa perangkat Anda. Setelah Teller menginput nominal, layar aplikasi Anda akan meminta PIN konfirmasi.");
    }

    // --- QR CODE & SCANNER ---
    function renderMyQR() {
        document.getElementById('qrOwnerName').textContent = state.user.name;
        document.getElementById('qrOwnerHp').textContent = `No. Rekening: ${state.user.hp}`;
        const box = document.getElementById('qrcode');
        box.innerHTML = "";
        QRCode.toCanvas(document.createElement('canvas'), `REK:${state.user.hp}`, { width: 180, margin: 1 }, (err, canvas) => {
            if (!err) box.appendChild(canvas);
        });
    }

    function openScanner(context) {
        state.scanContext = context;
        navigate('scanner');
        setTimeout(() => {
            state.scannerInstance = new Html5Qrcode("qr-reader");
            state.scannerInstance.start(
                { facingMode: "environment" },
                { fps: 15, qrbox: { width: 180, height: 180 } },
                (decoded) => {
                    const hp = decoded.replace(/^REK:/i, '').trim();
                    stopScanner();
                    if (state.scanContext === 'setor') {
                        selectedSetorHp = hp;
                        document.getElementById('setorTarget').value = hp;
                        navigate('setorAdmin');
                    } else {
                        selectedTfHp = hp;
                        document.getElementById('tfTarget').value = hp;
                        navigate('transfer');
                    }
                },
                () => {}
            ).catch(() => showModal("Kamera Gagal", "Pastikan izin kamera diaktifkan pada browser."));
        }, 200);
    }

    function stopScanner() {
        if (state.scannerInstance) {
            const ref = state.scannerInstance;
            state.scannerInstance = null;
            ref.stop().then(() => ref.clear()).catch(() => {});
        }
    }

    // --- MUTATIONS, REPORTS & ADMIN ---
    function renderMutations() {
        const list = document.getElementById('mutasiList');
        const filtered = state.user.isAdmin
            ? state.mutations
            : state.mutations.filter(m => m.user === state.user.name || (m.title && m.title.includes(state.user.name)));

        list.innerHTML = filtered.length
            ? filtered.map(m => `
                <div class="list-item">
                    <div>
                        <div style="font-weight:600;">${m.title}</div>
                        <small style="color:var(--muted);">${m.time} ${state.user.isAdmin ? `• ${m.user}` : ''}</small>
                    </div>
                    <strong style="color:${m.color || '#fff'}">${m.amount}</strong>
                </div>`).join('')
            : `<div class="list-item" style="justify-content:center; color:var(--muted);">Belum ada transaksi</div>`;
    }

    function renderRekap() {
        document.getElementById('rekapList').innerHTML = state.members.map(m => `
            <div class="list-item">
                <div><strong>${m.name}</strong><br><small style="color:var(--muted);">${m.hp}</small></div>
                <strong style="color:var(--success);">Rp ${(Number(m.saldo) || 0).toLocaleString('id-ID')}</strong>
            </div>`).join('');
    }

    function exportPDF() {
        html2pdf().from(document.getElementById('pdfArea')).set({
            margin: 10, filename: `Laporan_Tabungan_${new Date().toISOString().slice(0,10)}.pdf`,
            html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' }
        }).save();
    }

    function renderNasabah() {
        document.getElementById('nasabahList').innerHTML = state.members.map((m, idx) => {
            const isProtectedAdmin = idx === 0 || String(m.role || "").toLowerCase() === "admin";
            const actionControl = isProtectedAdmin
                ? `<span style="font-size:0.75rem; color:var(--muted); font-weight:600;">Admin Utama</span>`
                : `<button class="btn-sm btn-logout" onclick="deleteNasabah('${m.hp}')">Hapus</button>`;

            return `
                <div class="list-item">
                    <div><strong>${m.name}</strong><br><small style="color:var(--muted);">${m.hp} • Rp ${(Number(m.saldo)||0).toLocaleString('id-ID')}</small></div>
                    ${actionControl}
                </div>`;
        }).join('');
    }

    function showAddMemberModal() {
        showModal(
            "Registrasi Nasabah Baru",
            "Nasabah akan diminta membuat PIN pribadi saat login pertama kali.",
            `<input type="text" id="newMemName" placeholder="Nama Lengkap" style="width:100%; padding:10px; margin-bottom:8px; background:var(--bg); border:1px solid var(--border); color:#fff; border-radius:8px;">
             <input type="tel" id="newMemHp" placeholder="Nomor HP (Rekening)" style="width:100%; padding:10px; background:var(--bg); border:1px solid var(--border); color:#fff; border-radius:8px;">`,
            `<button class="btn-sm" style="flex:1; padding:12px;" onclick="closeModal()">Batal</button>
             <button class="btn-primary" style="flex:1; margin:0;" onclick="saveNewMember()">Simpan</button>`
        );
    }

    async function saveNewMember() {
        const name = document.getElementById('newMemName').value.trim();
        const hp = document.getElementById('newMemHp').value.trim();
        if (!name || !hp) return alert("Nama dan Nomor HP wajib diisi.");

        closeModal();
        await sendPost({ type: "addMember", name, hp, saldo: 0, pass: "", pattern: "" });
        await syncData();
        renderNasabah();
    }

    async function deleteNasabah(hp) {
        const idx = state.members.findIndex(m => normalizeHp(m.hp) === normalizeHp(hp));
        if (idx === 0 || String(state.members[idx]?.role || "").toLowerCase() === "admin") {
            return showModal("Akses Dibatasi", "Akun Admin utama (pendaftar pertama) tidak dapat dihapus dari aplikasi.");
        }
        if (!confirm("Hapus rekening nasabah ini?")) return;
        await sendPost({ type: "deleteMember", hp });
        await syncData();
        renderNasabah();
    }

    // --- RECEIPT & MODAL HELPERS ---
    function showReceipt(data) {
        const waText = encodeURIComponent(
            `*BUKTI TRANSAKSI TABUNGAN WARGA*\n` +
            `Jenis: ${data.jenis}\nNama: ${data.nama}\nRekening: ${data.hp}\n` +
            `Nominal: Rp ${data.nominal.toLocaleString('id-ID')}\n` +
            `Saldo Akhir: Rp ${data.saldo.toLocaleString('id-ID')}\nWaktu: ${data.waktu}`
        );

        showModal(
            "Transaksi Berhasil",
            "Bukti transaksi digital telah diterbitkan:",
            `<div class="receipt">
                <div style="text-align:center; border-bottom:1px dashed #94a3b8; padding-bottom:6px; margin-bottom:8px;"><strong>BUKTI TRANSAKSI DIGITAL</strong></div>
                <div class="receipt-row"><span>Jenis:</span><strong>${data.jenis}</strong></div>
                <div class="receipt-row"><span>Nama:</span><strong>${data.nama}</strong></div>
                <div class="receipt-row"><span>Rekening:</span><span>${data.hp}</span></div>
                <div class="receipt-row"><span>Nominal:</span><strong>Rp ${data.nominal.toLocaleString('id-ID')}</strong></div>
                <div class="receipt-row"><span>Saldo Akhir:</span><strong>Rp ${data.saldo.toLocaleString('id-ID')}</strong></div>
                <div class="receipt-row"><span>Waktu:</span><span>${data.waktu}</span></div>
            </div>`,
            `<a href="https://wa.me/${data.hp}?text=${waText}" target="_blank" class="btn-primary btn-success" style="text-decoration:none; margin:0; flex:1;">Kirim WA</a>
             <button class="btn-sm" style="flex:1;" onclick="closeModal()">Tutup</button>`
        );
    }

    function showModal(title, desc, customHtml = "", actionsHtml = "") {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalDesc').innerHTML = desc;
        document.getElementById('modalCustom').innerHTML = customHtml;
        document.getElementById('modalActions').innerHTML = actionsHtml || `<button class="btn-primary" style="margin:0;" onclick="closeModal()">Tutup</button>`;
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
    }

    function setStatus(msg) {
        document.getElementById('statusBar').textContent = msg;
    }

    // Init
    syncData();
    setInterval(syncData, 6000);
</script>
</body>
</html>
